; Настройки, близкие к типовому shared-хостингу.
; Ошибки посетителю не показываем — они уходят в журнал (app/logs/php-error.log).
; Это касается и ошибок разбора файлов, которые случаются до запуска приложения.
display_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /var/www/app/logs/php-error.log

memory_limit = 128M
post_max_size = 16M
upload_max_filesize = 16M
max_execution_time = 60

date.timezone = Asia/Almaty
default_charset = UTF-8

expose_php = Off
